# Local production-shaped stack for CardIndex:
#   * db    — Postgres 17 (the "card information" store)
#   * minio — S3-compatible object storage (the image "bucket")
#   * createbucket — one-shot: creates the card-images bucket, public-read
#
# Start everything:   npm run db:up      (or: docker compose up -d)
# Postgres schema is applied automatically on first boot (see initdb mount).
# Swap Postgres for Supabase/Neon later by changing DATABASE_URL — nothing else.

services:
  db:
    image: postgres:17
    container_name: cardindex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardindex}
      POSTGRES_DB: ${POSTGRES_DB:-cardindex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Re-apply manually with `npm run db:schema`:
      - ./db:/db:ro
      # Auto-apply the schema on first boot (empty data dir only):
      - ./db/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardindex} -d ${POSTGRES_DB:-cardindex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: cardindex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console (http://localhost:9001)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and makes card images publicly viewable (they're meant to
  # be shown to customers). Runs once and exits.
  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-card-images} &&
      mc anonymous set download local/${S3_BUCKET:-card-images} &&
      echo 'bucket ${S3_BUCKET:-card-images} ready (public read)';
      "

volumes:
  pgdata:
  miniodata:
